name: Unpack zip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          unzip -q skin-portal-supabase.zip
          rm -rf repo/.git
          cp -a repo/. .
          rm -rf repo skin-portal-supabase.zip
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Import Supabase version"
          git push
